<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Círculo de fondo con gradiente -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo principal -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)" stroke="#fff" stroke-width="2"/>
  
  <!-- Ícono de gráfico de trading (línea de tendencia alcista) -->
  <g stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Línea de tendencia alcista -->
    <polyline points="20,70 35,55 50,60 65,35 80,30" />
  </g>
  
  <!-- Puntos de datos -->
  <circle cx="20" cy="70" r="3" fill="#10b981" />
  <circle cx="35" cy="55" r="3" fill="#10b981" />
  <circle cx="50" cy="60" r="3" fill="#f59e0b" />
  <circle cx="65" cy="35" r="3" fill="#10b981" />
  <circle cx="80" cy="30" r="3" fill="#10b981" />
  
  <!-- Flecha indicando tendencia alcista -->
  <g fill="#10b981">
    <polygon points="80,30 75,35 85,35" />
  </g>
</svg>
